<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
<title id="title">The Atlas Drifter — Vivek Ranjan</title>
<desc id="desc">A celestial atlas in antique gold above an obsidian ocean. Worlds built from curiosity. Senior Software Engineer, Dublin, Ireland.</desc>
