<text x="70" y="86" fill="#c8b180" font-family="Arial,sans-serif" font-size="15" letter-spacing="5">VIVEK RANJAN / THE ATLAS DRIFTER</text>
<text x="70" y="221" fill="#a7b4b8" font-family="Arial,sans-serif" font-size="16" letter-spacing="4">ENGINEER. BUILDER. EXPLORER.</text>
<g fill="#eee7d8" font-family="Georgia,serif" font-size="78"><text x="66" y="321">Worlds built</text><text x="66" y="411">from <tspan fill="#d5ba83" font-style="italic">curiosity.</tspan></text></g>
<text x="70" y="471" fill="#b0bdc3" font-family="Arial,sans-serif" font-size="20">Intelligent systems. Thoughtful tools. Shared tables.</text>
<text x="70" y="577" fill="#ccb583" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">SENIOR SOFTWARE ENGINEER</text>
<text x="1370" y="577" text-anchor="end" fill="#a7b4b8" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">DUBLIN, IRELAND</text>
